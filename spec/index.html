<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Full Flow Spec</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* Animation spec sheet for the whole noon flow — Home → Search → Results → iPhone widget → Notify → back.
   Same layout as a ProtoPie recording view: canvas (layers · flow · device · live preview · playback)
   over a timeline of property tracks — light bar = delay, dark bar = duration.
   The preview is the real prototype in an iframe; this page only drives it (it never edits it).
   System: 4/8/12/16/20 spacing · 15/13/12/11 type · 12px cards with a hairline · 32px controls. */
:root {
  --bg: #ffffff; --canvas: #eeeef1; --dot: #d9d9df; --card: #ffffff;
  --ink: #17171c; --ink-2: #63636e; --ink-3: #9b9ba6; --line: #ececf0; --line-2: #e2e2e8;
  --fill: #f4f4f7; --fill-2: #ededf1; --row: #f6f6f8; --delay: #e8e8ee; --dur: #2e323d; --dur-ink: #ffffff;
  --accent: #d97757; --accent-ink: #ffffff; --accent-50: #fbf0eb; --accent-600: #c2613f; --head: #ef4444;
  --r-card: 12px; --r-ctl: 8px; --r-trk: 6px;
  --sh-card: 0 0 0 1px rgba(17, 17, 28, .05), 0 1px 2px rgba(17, 17, 28, .04), 0 8px 24px -14px rgba(17, 17, 28, .18);
  --gut: 20px; --card-w: 360px;
  --lab: 320px; --rowh: 24px; --rowgap: 10px;
  --tl-pt: 16px; --tl-pr: 20px; --tl-pb: 24px;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-ctl); }

/* ── top bar ── */
.top { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 var(--gut) 0 12px; border-bottom: 1px solid var(--line); background: var(--bg); }
.top__back { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r-ctl); text-decoration: none; flex: none; transition: background-color .15s; }
.top__back svg { width: 18px; height: 18px; }
.top__back:hover { background: var(--fill); }
.top__title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top__title small { position: relative; margin-left: 12px; padding-left: 13px; color: var(--ink-2); font-size: 13px; font-weight: 400; letter-spacing: 0; }
.top__title small::before { content: ''; position: absolute; left: 0; top: 50%; width: 1px; height: 14px; margin-top: -7px; background: var(--line-2); }
.top__sp { flex: 1; }
.iters[hidden] { display: none; }
.iters { display: flex; gap: 2px; padding: 2px; background: var(--fill); border-radius: 10px; flex: none; }
.iters button { min-width: 38px; height: 28px; padding: 0 10px; border-radius: var(--r-ctl); font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink-2); transition: background-color .15s, color .15s; }
.iters button:hover { color: var(--ink); }
.iters button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 0 0 1px rgba(17, 17, 28, .06), 0 1px 2px rgba(17, 17, 28, .08); }
.copy { height: 32px; padding: 0 14px; border-radius: var(--r-ctl); background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 600; flex: none; box-shadow: 0 1px 2px rgba(194, 97, 63, .3), inset 0 1px 0 rgba(255, 255, 255, .14); transition: background-color .15s; }
.copy:hover { background: var(--accent-600); }

/* ── canvas ── */
.canvas { position: relative; height: clamp(600px, 66vh, 760px); overflow: hidden;
  background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 16px 16px; background-position: 8px 8px; }
.card { position: absolute; background: var(--card); border-radius: var(--r-card); box-shadow: var(--sh-card); }
.eyebrow, .flow h3, .device h3 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

/* left column: Layers and Flow are one accordion — opening one collapses the other to its header */
.side { position: absolute; left: var(--gut); top: var(--gut); bottom: calc(var(--gut) + 40px + 12px); width: var(--card-w); z-index: 4; display: flex; flex-direction: column; gap: 12px; }
.side > .card { position: relative; }
.layers { flex: none; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.layers[data-open="true"] { flex: 1 1 auto; }
.layers__btn { width: 100%; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 13px; font-weight: 600; border-radius: var(--r-card); }
.layers__btn:hover { background: #fafafb; }
.layers__btn svg { transition: transform .2s; }
.layers[data-open="true"] .layers__btn { border-radius: var(--r-card) var(--r-card) 0 0; }
.layers[data-open="true"] .layers__btn svg { transform: rotate(180deg); }
.layers__list { display: none; flex: 1 1 auto; min-height: 0; border-top: 1px solid var(--line); padding: 6px; overflow: auto; }
.layers[data-open="true"] .layers__list { display: block; animation: panelIn .22s cubic-bezier(.2, .8, .2, 1); }
.layers__list button { width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; font-size: 13px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.layers__list button:hover { background: var(--fill); }
.layers__list button[aria-pressed="true"] { background: var(--accent-50); color: var(--accent-600); font-weight: 600; }
.layers__list code { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }

.flow { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.flow__head { flex: none; width: 100%; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-radius: var(--r-card); }
.flow__head:hover { background: #fafafb; }
.flow__head svg { transform: rotate(180deg); transition: transform .2s; }
.flow.is-collapsed { flex: none; }
.flow.is-collapsed ol { display: none; }
.flow.is-collapsed .flow__head svg { transform: none; }
.flow:not(.is-collapsed) ol { animation: panelIn .22s cubic-bezier(.2, .8, .2, 1); }
@keyframes panelIn { from { opacity: 0; transform: translateY(-4px); } }
.flow ol { list-style: none; margin: 0; padding: 0 6px 6px; overflow: auto; }
.flow li + li { margin-top: 1px; }
.flow li button { position: relative; width: 100%; text-align: left; display: grid; grid-template-columns: 24px 1fr auto; gap: 1px 10px; align-items: center; padding: 8px 10px; border-radius: var(--r-ctl); transition: background-color .15s; }
.flow li button:hover { background: var(--fill); }
.flow li button[aria-pressed="true"] { background: var(--accent-50); }
.flow li button[aria-pressed="true"]::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--accent); }
.flow .n { grid-row: 1 / 3; align-self: start; margin-top: 1px; width: 24px; height: 20px; display: grid; place-items: center; border-radius: 6px; background: var(--fill); font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--ink-2); }
.flow button[aria-pressed="true"] .n { background: #fff; color: var(--accent-600); box-shadow: 0 0 0 1px rgba(217, 119, 87, .18); }
.flow .nm { font-size: 13px; font-weight: 600; letter-spacing: -0.005em; }
.flow .len { font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.flow .tr { grid-column: 2 / 4; font-size: 12px; line-height: 1.35; color: var(--ink-2); }
.flow button[aria-pressed="true"] .nm { color: var(--accent-600); }
.tag { display: inline-block; padding: 1px 6px; border-radius: 99px; background: var(--accent-50); color: var(--accent-600); font-size: 10.5px; font-weight: 600; line-height: 16px; vertical-align: 1px; margin-left: 6px; letter-spacing: 0; text-transform: none; }
.tag--warm { background: #fff3e8; color: #b4530b; }

.device { right: var(--gut); top: var(--gut); width: var(--card-w); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.device p { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--ink); }
.insp { right: var(--gut); top: calc(var(--gut) + 40px + 12px); width: var(--card-w); bottom: var(--gut); padding: 16px; overflow: auto; scrollbar-width: thin; }
.insp h3 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; line-height: 20px; }
.insp h3 span { font-weight: 400; color: var(--ink-2) !important; }
.insp__sub { margin: 6px 0 12px; font-size: 12px; color: var(--ink-2); }
.insp__sub code { display: inline-block; padding: 2px 6px; border-radius: 5px; background: var(--fill); color: var(--ink-2); font-family: var(--mono); font-size: 11px !important; }
.insp dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; font-size: 12.5px; }
.insp dt { color: var(--ink-2); }
.insp dd { margin: 0; font-family: var(--mono); font-size: 11.5px; text-align: right; word-break: break-word; font-variant-numeric: tabular-nums; color: var(--ink); }
.insp hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
.insp__plot { display: block; width: 100%; height: 104px; margin: 0 0 14px; padding: 6px 4px; border-radius: 10px; background: #fafafc; box-shadow: inset 0 0 0 1px var(--line); }
.insp__note { font-size: 12px; line-height: 1.5; color: var(--ink-2); margin: 12px 0 0; }
.insp__code { display: block; margin-top: 12px; padding: 10px 12px; background: var(--fill); border-radius: var(--r-ctl); font-family: var(--mono); font-size: 10.5px; line-height: 1.55; color: var(--ink-2); word-break: break-all; }
.insp__go { margin-top: 16px; height: 32px; padding: 0 14px; border-radius: var(--r-ctl); background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; transition: background-color .15s; }
.insp__go:hover { background: var(--accent-600); }

.stage { position: absolute; left: 50%; top: var(--gut); bottom: var(--gut); transform: translateX(-50%); display: grid; place-items: start center; }
.phone { position: relative; width: var(--pw, 375px); height: var(--ph, 812px); transform-origin: 0 0; background: #fff; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(17, 17, 28, .08), 0 2px 6px rgba(17, 17, 28, .06), 0 24px 48px -20px rgba(17, 17, 28, .28); }
.phone iframe { position: absolute; left: 0; top: 0; width: var(--pw, 375px); height: var(--ph, 812px); border: 0; opacity: 0; pointer-events: none; }
.phone iframe.is-front { opacity: 1; pointer-events: auto; }
.phone__veil { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 255, 255, .92); font-size: 22px; font-weight: 500; color: var(--ink-2); transition: opacity .25s; text-align: center; padding: 40px; }
.phone__veil[hidden] { display: grid; opacity: 0; pointer-events: none; }
.rec { position: absolute; z-index: 2; left: 28px; top: 28px; width: 14px; height: 14px; border-radius: 50%; background: var(--head); box-shadow: 0 0 0 4px rgba(239, 68, 68, .2); opacity: 0; transition: opacity .2s; }
.rec.is-on { opacity: 1; animation: recPulse 1.6s ease-in-out infinite; }
@keyframes recPulse { 50% { box-shadow: 0 0 0 7px rgba(239, 68, 68, .08); } }

.ctrl { position: absolute; left: var(--gut); bottom: var(--gut); height: 40px; display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--card); border-radius: var(--r-card); box-shadow: var(--sh-card); z-index: 3; }
.ctrl button { height: 32px; min-width: 32px; padding: 0 10px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--r-ctl); transition: background-color .15s; }
.ctrl button:hover { background: var(--fill); }
.ctrl #play { width: 32px; padding: 0; background: var(--fill); }
.ctrl #play:hover { background: var(--fill-2); }
.ctrl #play svg { width: 12px; height: 13px; margin-left: 1px; }
.ctrl #speed svg { width: 17px; height: 14px; }
.ctrl i { width: 1px; height: 16px; margin: 0 4px; background: var(--line-2); }
.ctrl__speed { font-family: var(--mono); font-size: 12px; font-weight: 500; }
.ctrl__state { padding: 0 10px 0 6px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ── timeline ── */
.tlwrap { overflow-x: auto; border-top: 1px solid var(--line); }
.tl { position: relative; min-width: 940px; padding: var(--tl-pt) var(--tl-pr) var(--tl-pb) 0; }
.tl__ruler { display: grid; grid-template-columns: var(--lab) 1fr; align-items: center; height: 40px; }
.tl__start { height: 30px; margin-left: 12px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 10px; background: var(--fill); border-radius: var(--r-ctl); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; min-width: 0; }
.tl__start svg { flex: none; width: 13px; height: 12px; }
.tl__start small { font-size: 12px; color: var(--ink-2); font-weight: 400; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tl__scale { position: relative; height: 40px; margin-left: 10px; }
.tl__scale::after { content: ''; position: absolute; left: 0; right: 0; top: 26px; height: 1px; background: var(--line-2); }
.tick { position: absolute; top: 5px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tick::after { content: ''; position: absolute; left: 50%; top: 18.5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--dur); }
.tick--minor { color: transparent; }
.tick--minor::after { width: 1px; height: 4px; margin-left: 0; border-radius: 0; background: #cfcfd6; top: 19.5px; }
.tick--zero { transform: none; }
.tick--zero::after { left: 0; margin-left: 0; }
.tl__rows { position: relative; }
.grp { display: grid; grid-template-columns: var(--lab) 1fr; height: 34px; align-items: end; padding-bottom: 4px; }
.grp b { padding-left: 22px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.grp span { position: relative; margin-left: 10px; padding-bottom: 1px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.grp span::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.row { display: grid; grid-template-columns: var(--lab) 1fr; height: calc(var(--rowh) + var(--rowgap)); align-items: center; cursor: pointer; }
.row__lab { display: flex; align-items: center; gap: 10px; height: calc(var(--rowh) + 4px); margin-left: 12px; padding-left: 10px; border-radius: var(--r-ctl); font-size: 13px; white-space: nowrap; overflow: hidden; transition: background-color .15s; }
.row__lab svg { flex: none; width: 15px; height: 15px; opacity: .85; }
.row__lab b { font-weight: 600; }
.row__lab span { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.row__lab em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.row:hover .row__lab { background: var(--row); }
.row__trk { position: relative; height: var(--rowh); margin-left: 10px; background: var(--row); border-radius: var(--r-trk); overflow: hidden; transition: background-color .15s; }
.row:hover .row__trk { background: #f0f0f4; }
.row[aria-selected="true"] .row__lab { background: var(--accent-50); }
.row[aria-selected="true"] .row__lab b { color: var(--accent-600); }
.row[aria-selected="true"] .row__trk { box-shadow: inset 0 0 0 1.5px var(--accent); }
.row.is-dim { opacity: .3; }
.bar { position: absolute; top: 0; height: 100%; display: grid; place-items: center; overflow: hidden; font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar--delay { background: var(--delay); color: var(--ink-2); }
.bar--dur { background: var(--dur); color: var(--dur-ink); border-radius: 5px; }
.bar--approx { background: repeating-linear-gradient(135deg, #2e323d 0 6px, #4a4f5c 6px 12px); }
.bar--repeat { background: linear-gradient(90deg, #2e323d 70%, rgba(46, 50, 61, .2)); }
.bar--step { border-radius: 2px; }
.bar--mark { width: 2px; margin-left: -1px; background: var(--dur); border-radius: 1px; }
.bar--scene { background: var(--accent); }
.bar span { padding: 0 6px; }
.after { position: absolute; top: 0; height: 100%; display: flex; align-items: center; padding-left: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); white-space: nowrap; pointer-events: none; }
.head { position: absolute; top: 2px; bottom: 0; width: 0; pointer-events: none; z-index: 2; }
.head::before { content: ''; position: absolute; left: -0.75px; top: 10px; bottom: 0; width: 1.5px; background: var(--head); }
.head::after { content: ''; position: absolute; left: -7px; top: 0; width: 14px; height: 14px; background: var(--head); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 1px 3px rgba(239, 68, 68, .35); }
.grip { position: absolute; left: -14px; top: -8px; width: 28px; height: 30px; pointer-events: auto; cursor: grab; border-radius: 50%; }
.head__line { position: absolute; left: -7px; width: 14px; top: 20px; bottom: 0; pointer-events: auto; cursor: ew-resize; }
.row__trk { cursor: ew-resize; touch-action: none; }
.grip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
body.is-scrubbing, body.is-scrubbing * { cursor: grabbing !important; user-select: none; }
.tl__scale { cursor: ew-resize; touch-action: none; }
.grip { touch-action: none; }
.buf { position: absolute; left: 0; top: 24px; height: 3px; width: 0; background: #f0c4b2; border-radius: 2px; transition: width .1s linear; }
.lane { position: absolute; top: var(--tl-pt); bottom: var(--tl-pb); left: calc(var(--lab) + 10px); right: var(--tl-pr); pointer-events: none; }
.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin: 0; padding: 4px var(--tl-pr) 28px calc(var(--lab) + 10px); font-size: 12px; color: var(--ink-2); line-height: 1.6; }
.foot code { font-family: var(--mono); font-size: 12px; }
.legend { display: inline-flex; align-items: center; gap: 8px; }
.legend i { display: inline-block; width: 18px; height: 8px; border-radius: 2px; }

@media (max-width: 1240px) { :root { --card-w: 300px; } }
@media (max-width: 960px) {
  :root { --lab: 220px; --gut: 16px; }
  .canvas { height: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card, .stage, .ctrl, .side { position: static; transform: none; width: auto; }
  .side { flex: none; }
  .flow { max-height: 340px; }
  .layers[data-open="true"] .layers__list { max-height: 340px; }
  .stage { order: 2; height: 520px; }
  .ctrl { order: 3; align-self: flex-start; }
  .insp { order: 4; }
  .top__title small { display: none; }
  .row__lab { gap: 8px; }
  .foot { padding-left: 16px; }
}
@media (max-width: 560px) { .copy { display: none; } .top { gap: 8px; } .iters button { min-width: 32px; padding: 0 6px; } }
</style>
</head>
<body>
<header class="top">
  <a class="top__back" id="back" href="/" aria-label="Back to the prototype"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M20 12H4m0 0 6.5-6.5M4 12l6.5 6.5" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <div class="top__title" id="title">Full Flow — Animation Spec</div>
  <div class="top__sp"></div>
  <div class="iters" id="iters" role="group" aria-label="Iteration">
  </div>
  <button class="copy" id="copy">Copy link</button>
</header>

<section class="canvas" id="canvas">
  <div class="side" id="side">
  <div class="card layers" id="layers" data-open="false">
    <button class="layers__btn" id="layersBtn" aria-expanded="false"><span id="layersLabel">Layers</span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0h10L5 6z" fill="#8e8e93"/></svg></button>
    <div class="layers__list" id="layersList"></div>
  </div>
  <nav class="card flow" aria-label="Flow scenes"><button class="flow__head" id="flowHead" aria-expanded="true"><h3>Flow</h3><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0h10L5 6z" fill="#8e8e93"/></svg></button><ol id="flow"></ol></nav>
  </div>
  <div class="stage" id="stage">
    <div class="phone" id="phone">
      <span class="rec" id="rec" aria-hidden="true"></span>
      <div class="phone__veil" id="veil">Loading the prototype…</div>
    </div>
  </div>
  <div class="card device"><h3>Device</h3><p id="deviceLabel">Custom (375x812 @3x)</p></div>
  <aside class="card insp" id="insp" aria-live="polite"></aside>
  <div class="ctrl">
    <button id="play" aria-label="Play"><svg id="playIco" width="16" height="18" viewBox="0 0 16 18"><path d="M1 1.5v15L15 9z" fill="#1d1d1f"/></svg></button>
    <i></i>

<script>
/* ═══ SpecKit — generic helpers shared by every spec sheet (do not edit per project) ═══
   Row helpers: S(spring key, {x0, v0}) · C(curve key) · H(haptic kind, layer, selector, ms | [ms…], note)
   Maths: springFn(ω, ζ, x0, v0) → { d(t), v(t) } (t in s) · firstT(f, test) → first ms where test(d, v)
   Layout: rowEnd(row) / sceneEnd(rows) in ms.                                                     */
window.SpecKit = (() => {
  const springFn = (w, z, x0, v0 = 0) => { const wd = w * Math.sqrt(1 - z * z), a = z * w;
    return { d: (t) => Math.exp(-a * t) * (x0 * Math.cos(wd * t) + ((v0 + a * x0) / wd) * Math.sin(wd * t)),
             v: (t) => Math.exp(-a * t) * (v0 * Math.cos(wd * t) - ((a * v0 + w * w * x0) / wd) * Math.sin(wd * t)) }; };
  const firstT = (f, test, max = 4) => { for (let t = 0; t < max; t += 0.001) if (test(f.d(t), f.v(t))) return t * 1000; return max * 1000; };
  const S = (k, extra = {}) => ({ kind: 'spring', k, ...extra });
  const C = (k) => ({ kind: 'curve', k });
  // haptics (app.js Haptics): iOS generator + style, Android vibrate, iOS-Safari fallback
  const HAP = {
    tap:     { name: 'tap',     gen: 'UIImpactFeedbackGenerator', style: 'light', vibe: '8ms', call: 'Haptics.tap()' },
    tick:    { name: 'tick',    gen: 'UISelectionFeedbackGenerator', style: 'selection', vibe: '4ms', call: 'Haptics.tick()' },
    snap:    { name: 'snap',    gen: 'UIImpactFeedbackGenerator', style: 'medium', intensity: 0.8, vibe: '12ms', call: 'Haptics.snap()' },
    edge:    { name: 'edge',    gen: 'UIImpactFeedbackGenerator', style: 'rigid', intensity: 0.6, vibe: '10ms', call: 'Haptics.edge()' },
    success: { name: 'success', gen: 'UINotificationFeedbackGenerator', style: 'success', vibe: '[10, 40, 16]', call: 'Haptics.success()' },
  };
  const H = (k, layer, sel, at, note, extra = {}) => ({ icon: 'haptic', prop: 'Haptic', layer, sel, delay: Array.isArray(at) ? (at[0] || 0) : at, dur: 10, from: '—', to: '—',
    ease: { kind: 'haptic', ...HAP[k] }, marks: Array.isArray(at) ? at : [at], note, ...extra });
  const rowEnd = (r) => r.delay + (r.stagger ? (r.stagger.n - 1) * r.stagger.step : 0) + (r.marks ? Math.max(...r.marks) - r.delay : 0) + r.dur;
  const sceneEnd = (rows) => Math.max(...rows.filter((r) => !r.grp && !r.repeat).map(rowEnd));
  // a PP-style sampled spring's length for a travel of |d| (settles to 0.02 of a unit)
  const sampleLen = (spr, d) => 1000 * Math.max(0.2, Math.log(Math.max(Math.abs(d), 0.02) / 0.02) / (spr.z * spr.w) + 0.05);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));   // real time (for history / tasks to land)
  return { springFn, firstT, S, C, H, HAP, rowEnd, sceneEnd, sampleLen, wait };
})();
</script>

<script>

(() => {

  const $ = (id) => document.getElementById(id);
  const fmtS = (ms) => `${(+(ms / 1000).toFixed(2))}s`;
  const fmtMs = (ms) => `${Math.round(ms)}ms`;
  const ICON = {
    scale: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 16 16 4M4 16v-5M4 16h5M16 4h-5M16 4v5" stroke="#1d1d1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    opacity: '<svg width="20" height="20" viewBox="0 0 20 20"><g fill="#1d1d1f"><rect x="3" y="3" width="4" height="4"/><rect x="11" y="3" width="4" height="4"/><rect x="7" y="7" width="4" height="4"/><rect x="15" y="7" width="2" height="4"/><rect x="3" y="11" width="4" height="4"/><rect x="11" y="11" width="4" height="4"/><rect x="7" y="15" width="4" height="2"/></g><g fill="#c7c7cc"><rect x="7" y="3" width="4" height="4"/><rect x="3" y="7" width="4" height="4"/><rect x="11" y="7" width="4" height="4"/><rect x="7" y="11" width="4" height="4"/><rect x="15" y="11" width="2" height="4"/></g></svg>',
    move: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2v16M2 10h16" stroke="#1d1d1f" stroke-width="1.6"/><path d="m10 1.5 2.4 3H7.6zM10 18.5l2.4-3H7.6zM1.5 10l3-2.4v4.8zM18.5 10l-3-2.4v4.8z" fill="#1d1d1f"/></svg>',
    size: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2.5v15" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round"/><path d="m6.5 6 3.5-3.5L13.5 6M6.5 14l3.5 3.5 3.5-3.5" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 2.5h14M3 17.5h14" stroke="#c7c7cc" stroke-width="1.4"/></svg>',
    haptic: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="6.5" y="3" width="7" height="14" rx="1.8" stroke="#1d1d1f" stroke-width="1.6"/><path d="M3.5 7v6M1.5 8.5v3M16.5 7v6M18.5 8.5v3" stroke="#1d1d1f" stroke-width="1.6" stroke-linecap="round"/></svg>',
    sound: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 8v4h3l4 3.5v-11L6 8z" fill="#1d1d1f"/><path d="M13 7.5a3.5 3.5 0 0 1 0 5M15.2 5.5a6.5 6.5 0 0 1 0 9" stroke="#1d1d1f" stroke-width="1.6" stroke-linecap="round"/></svg>',
    flag: '<svg width="18" height="16" viewBox="0 0 18 16"><path d="M2 1v14" stroke="#1d1d1f" stroke-width="2"/><path d="M3 1.5h12l-3 4 3 4H3z" fill="#1d1d1f"/></svg>',
  };
  function linearAt(fn, u) {
    const parts = fn.replace(/^linear\(|\)$/g, '').split(',').map((s) => s.trim().split(/\s+/));
    const pts = parts.map((p) => ({ y: +p[0], x: p[1] ? parseFloat(p[1]) / 100 : null }));
    pts[0].x ??= 0; pts[pts.length - 1].x ??= 1;
    for (let i = 1; i < pts.length - 1; i++) if (pts[i].x == null) { let j = i; while (pts[j].x == null) j++; const a = pts[i - 1].x, b = pts[j].x; for (let k = i; k < j; k++) pts[k].x = a + ((b - a) * (k - i + 1)) / (j - i + 1); }
    for (let i = 1; i < pts.length; i++) if (u <= pts[i].x) { const p = pts[i - 1], q = pts[i]; return p.y + ((q.y - p.y) * (u - p.x)) / ((q.x - p.x) || 1); }
    return 1;
  }
  function springProgress(e) { const s = SPR[e.k], x0 = e.x0 ?? -1, f = springFn(s.w, s.z, x0, e.v0 ?? 0); return (t) => 1 - f.d(t) / x0; }
  function springStats(e) {
    const p = springProgress(e); let peak = 0, settle = 0;
    for (let t = 0; t < 4; t += 0.001) { const y = p(t); peak = Math.max(peak, y); if (Math.abs(1 - y) > 0.01) settle = t; }
    return { overshoot: Math.max(0, peak - 1) * 100, settle: settle * 1000 };
  }

  /* ═══ state ═══════════════════════════════════════════════════════════════ */
  const qs = new URLSearchParams(location.search);
  let v = +qs.get('v') || 2; if (!PATHS[v]) v = 2;
  let sc = qs.has('s') ? +qs.get('s') : 0; if (!SCENES[sc]) sc = 0;
  let rows = [], beats = [], END = 2000, selected = -1, layerFilter = '';
  const SPEEDS = [1, 0.5, 0.25]; let speedIdx = 0;

  /* ═══ flow list + timeline ═══════════════════════════════════════════════ */
  function renderFlow() {
    $('flow').innerHTML = SCENES.map((s) => {
      const len = s.overview ? sceneEnd(overview(v).rows) : sceneEnd(s.rows(v));
      return `<li><button data-s="${s.id}" aria-pressed="${s.id === sc}"><span class="n">${String(s.id).padStart(2, '0')}</span>
        <span class="nm">${s.name}${s.varies ? '<span class="tag tag--warm">varies</span>' : ''}</span><span class="len">${fmtS(len)}</span>
        <span class="tr">${s.summary || s.trig}</span></button></li>`;
    }).join('');
  }
  const pct = (ms) => `${(ms / END) * 100}%`;
  function bars(r) {
    const lbl = (ms) => (ms / END) * 1000 > 34;
    const tight = (r.stagger || r.marks) && rowEnd(r) / END > 0.8;
    const sum = r.stagger ? `${fmtS(r.dur)} · ×${r.stagger.n} / ${r.stagger.step}ms`
      : r.marks && r.ease.kind === 'haptic' ? `${r.marks.length > 1 ? `×${r.marks.length} · ` : ''}${r.ease.style}${r.ease.intensity ? ` @${r.ease.intensity}` : ''}`
      : r.marks ? (r.marks.length > 1 ? `×${r.marks.length} · ${r.ease.ms}ms each` : `${r.ease.ms}ms`) : '';
    let h = r.delay > 0 ? `<div class="bar bar--delay" style="left:0;width:${pct(r.delay)}">${lbl(r.delay) ? `<span>${r.approx ? '≈' : ''}${fmtS(r.delay)}${tight ? ` → ${sum}` : ''}</span>` : ''}</div>` : '';
    if (r.marks) {
      h += r.marks.map((m) => `<div class="bar bar--mark" style="left:${pct(m)}"></div>`).join('');
      if (!tight) h += `<span class="after" style="left:${pct(Math.max(...r.marks))}">${sum}</span>`;
    } else if (r.stagger) {
      const { n, step } = r.stagger, hh = 100 / n;
      for (let k = 0; k < n; k++) h += `<div class="bar bar--dur bar--step" style="left:${pct(r.delay + k * step)};width:${pct(r.dur)};top:${k * hh}%;height:${hh - 6 / n}%"></div>`;
      if (!tight) h += `<span class="after" style="left:${pct(rowEnd(r))}">${sum}</span>`;
    } else {
      const cls = r.scene != null ? ' bar--scene' : r.approx ? ' bar--approx' : r.repeat ? ' bar--repeat' : '';
      h += `<div class="bar bar--dur${cls}" style="left:${pct(r.delay)};width:${pct(Math.min(r.dur, END - r.delay))}">${lbl(r.dur) ? `<span>${r.approx ? '≈' : ''}${fmtS(r.dur)}${r.repeat ? ' ↻' : ''}</span>` : ''}</div>`;
    }
    return h;
  }
  function renderTimeline() {
    const S0 = SCENES[sc];
    if (S0.overview) { const o = overview(v); rows = o.rows; beats = o.beats; } else { rows = S0.rows(v); beats = []; }
    const last = sceneEnd(rows);
    const unit = last > 6000 ? 1000 : last > 2400 ? 500 : 100;
    END = Math.ceil((last + Math.max(60, last * 0.05)) / unit) * unit;
    let s = `<span class="tick tick--zero" style="left:0">0</span>`;
    const minor = unit === 1000 ? 500 : 100, major = unit === 1000 ? 1000 : 500;
    for (let t = minor; t < END; t += minor) s += `<span class="tick tick--minor" style="left:${pct(t)}">.</span>`;
    for (let t = major; t < END; t += major) if (Math.abs(t - last) > END * 0.04) s += `<span class="tick" style="left:${pct(t)};color:var(--ink-3)">${fmtS(t)}</span>`;
    s += `<span class="tick" style="left:${pct(last)}">${fmtS(last)}</span>`;
    $('scale').innerHTML = s;
    $('trigger').textContent = `· ${S0.trig}`;
    $('rows').innerHTML = rows.map((r, i) => r.grp
      ? `<div class="grp"><b>${r.grp}</b><span>@ ${fmtMs(r.at)}</span></div>`
      : `<div class="row" role="button" tabindex="0" data-i="${i}" aria-selected="false">
           <div class="row__lab">${ICON[r.icon]}<b>${r.scene != null ? `<em>${r.prop.padStart(2, '0')}</em>` : r.prop}</b><span>${r.layer}</span></div>
           <div class="row__trk">${bars(r)}</div></div>`).join('');
    const layers = [...new Map(rows.filter((r) => !r.grp && r.sel).map((r) => [r.layer, r.sel])).entries()];
    $('layersList').innerHTML = `<button data-l="" aria-pressed="${!layerFilter}">All layers <code>${rows.filter((r) => !r.grp).length} tracks</code></button>` +
      layers.map(([l, q]) => `<button data-l="${l}" aria-pressed="${layerFilter === l}">${l} <code>${q}</code></button>`).join('');
    applyFilter();
    select(rows.findIndex((r) => !r.grp && (!layerFilter || r.layer === layerFilter)));
    $('title').innerHTML = `${window.SPEC.title} <small>${String(sc).padStart(2, '0')} ${S0.name} · ${ITER[v]}</small>`;
    document.querySelectorAll('#iters button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.v === v)));
    $('back').href = PATHS[v];
    setHead(END); renderFlow();

      if (r.sc) { const x = at(r.sc, T); if (x !== r.sca) { const [top, left] = x.split(','); el.scrollTop = +top; el.scrollLeft = +left; r.sca = x; } }
      for (const [key, arr] of r.ps) { const val = at(arr, T); if (val) { const [ps, p] = key.split('|'); css += `[data-sk="${sk}"]${ps}{${p}:${val}!important}`; } }
    }
    if (css !== D.css) { D.ov.textContent = css; D.css = css; }
  }

  function setMode(m) {
    mode = m;
    $('playIco').innerHTML = m === 'playing' ? '<rect x="2" y="1.5" width="4" height="15" rx="1" fill="#1d1d1f"/><rect x="10" y="1.5" width="4" height="15" rx="1" fill="#1d1d1f"/>' : '<path d="M1 1.5v15L15 9z" fill="#1d1d1f"/>';
    $('rec').classList.toggle('is-on', m === 'playing');
    $('play').setAttribute('aria-label', m === 'playing' ? 'Pause' : 'Play');
  }
  function paint() {
    const T = headT ?? playT, up = REC ? (REC.done ? END : Math.max(0, REC.upTo)) : 0;
    const shown = Math.min(T, up);
    if (shown !== lastShown) { const c0 = performance.now(); applyAt(shown); if (window.__spec) (window.__spec.cost ||= []).push(performance.now() - c0); lastShown = shown; hlAt = -1; }
    setHead(T);
    $('buf').style.width = `${(up / END) * 100}%`;
    $('state').textContent = `${fmtS(Math.min(T, END))} / ${fmtS(END)}${REC && !REC.done ? ` · recording ${Math.round((up / END) * 100)}%` : mode === 'paused' ? ' · paused' : mode === 'done' ? ' · done' : ''}`;
    if (hlSel && hlAt !== shown) { highlight(hlSel); hlAt = shown; }
  }
  let lastTs = performance.now();
  function loop(ts) {
    const dt = Math.min(64, ts - lastTs); lastTs = ts;
    if (mode === 'playing' && REC) {
      const up = REC.done ? END : Math.max(0, REC.upTo);
      playT = Math.min(playT + dt * SPEEDS[speedIdx], END);
      if (playT > up) playT = up;                               // never run ahead of the recording
      if (playT >= END) { playT = END; setMode('done'); }
    }
    if (REC) paint();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  // ?debug: a hook for automated checks (a separate live frame driven to the same instant)
  if (qs.has('debug')) window.__spec = { async truth(T) { const fr = await makeFrame(); const t0 = fr.eng.now();
    if (SCENES[sc].overview) beats.forEach((bt) => fr.w.setTimeout(() => bt.fire(fr.w.document, fr.w), bt.at)); else await FIRE[sc](fr.w.document, fr.w);
    await flush(); const dt = END > 6000 ? 1000 / 60 : 1000 / 120; for (let t = dt; t <= T + 1e-6; t += dt) await fr.eng.advanceTo(t0 + t, dt); return fr.f; }, get ready() { return !!(REC && REC.done); }, get REC() { return REC; } };
  async function rebuild() {                                    // scene or iteration changed: record it
    const g = ++gen; setMode('idle'); playT = 0; headT = null; REC = null; lastShown = -1;
    [...phone.querySelectorAll('iframe:not(.is-front)')].forEach((f) => f.remove());
    $('veil').hidden = !phone.querySelector('iframe.is-front'); $('veil').textContent = 'Recording the scene…';
    setHead(0); $('buf').style.width = '0%';
    try { await record(g); } catch (e) { if (g === gen) { $('veil').hidden = false; $('veil').textContent = 'Preview unavailable — reload to try again.'; } }
  }
  function togglePlay() {
    if (!REC) return;
    if (mode === 'playing') { setMode('paused'); return; }
    if (playT >= END - 1) playT = 0;
    setMode('playing');
  }
  /* Scrubbing: press on the pin, the line, the ruler or any track and drag — the display
     shows that exact moment in the same frame. A press on a track that doesn't move also
     selects that track.                                                                  */
  let scrubbing = null, downX = 0, downRow = null;
  function scrubAt(clientX) {
    const r = $('lane').getBoundingClientRect();
    const T = Math.max(0, Math.min(END, ((clientX - r.left) / r.width) * END));
    if (mode === 'playing' || mode === 'done' || mode === 'idle') setMode('paused');
    playT = T; headT = null; paint();
  }
  const onMove = (e) => { if (e.pointerId === scrubbing) { e.preventDefault(); if (Math.abs(e.clientX - downX) > 2) downRow = null; scrubAt(e.clientX); } };
  const onUp = (e) => {
    if (e.pointerId !== scrubbing) return;
    scrubbing = null; document.body.classList.remove('is-scrubbing');
    removeEventListener('pointermove', onMove); removeEventListener('pointerup', onUp); removeEventListener('pointercancel', onUp);
    if (downRow != null) select(downRow);
  };
  function startScrub(e, row = null) {
    if (e.button !== 0 || scrubbing != null) return;
    e.preventDefault(); scrubbing = e.pointerId; downX = e.clientX; downRow = row;
    document.body.classList.add('is-scrubbing');
    addEventListener('pointermove', onMove, { passive: false }); addEventListener('pointerup', onUp); addEventListener('pointercancel', onUp);
    scrubAt(e.clientX);
  }
  for (const el of [$('scale'), $('grip'), $('headLine')]) el.addEventListener('pointerdown', (e) => startScrub(e));
  $('rows').addEventListener('pointerdown', (e) => { const trk = e.target.closest('.row__trk'); if (trk) startScrub(e, +trk.parentElement.dataset.i); });
  $('grip').addEventListener('keydown', (e) => { const step = e.shiftKey ? 100 : 1000 / 60;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); setMode('paused');
      playT = Math.max(0, Math.min(END, playT + (e.key === 'ArrowRight' ? step : -step))); paint(); } });

  function fit() {
    const st = $('stage'), h = st.clientHeight || 520, s = Math.min(1, h / DH);
    $('phone').style.transform = `scale(${s})`;
    st.style.width = `${DW * s}px`; $('phone').style.marginBottom = `${-DH * (1 - s)}px`;
  }
  addEventListener('resize', fit);

  /* ═══ wiring ═══════════════════════════════════════════════════════════════ */
  function setScene(n) { sc = n; layerFilter = ''; history.replaceState(null, '', `?v=${v}&s=${sc}`); renderTimeline(); rebuild(); }
  $('flow').addEventListener('click', (e) => { const b = e.target.closest('button[data-s]'); if (b && +b.dataset.s !== sc) setScene(+b.dataset.s); });
  $('insp').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) setScene(+b.dataset.go); });
  $('rows').addEventListener('click', (e) => { const r = e.target.closest('.row'); if (r && !e.target.closest('.row__trk')) select(+r.dataset.i); });
  $('rows').addEventListener('dblclick', (e) => { const r = e.target.closest('.row'); if (r && rows[+r.dataset.i].scene != null) setScene(rows[+r.dataset.i].scene); });
  $('rows').addEventListener('keydown', (e) => { const r = e.target.closest('.row'); if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(+r.dataset.i); } });
  $('rows').addEventListener('mouseover', (e) => { const r = e.target.closest('.row'); if (r) highlight(rows[+r.dataset.i].sel); });
  $('rows').addEventListener('mouseleave', () => { if (selected >= 0) highlight(rows[selected].sel); });
  $('play').addEventListener('click', () => togglePlay());
  $('speed').addEventListener('click', () => { speedIdx = (speedIdx + 1) % SPEEDS.length; $('speedLbl').textContent = `× ${SPEEDS[speedIdx]}`; });
  // Layers ⇄ Flow accordion: one is open, the other collapses to its header
  function setPanel(layersOpen) {
    $('layers').dataset.open = layersOpen; $('layersBtn').setAttribute('aria-expanded', layersOpen);
    document.querySelector('.flow').classList.toggle('is-collapsed', layersOpen); $('flowHead').setAttribute('aria-expanded', !layersOpen);
  }
  $('layersBtn').addEventListener('click', () => setPanel($('layers').dataset.open !== 'true'));
  $('flowHead').addEventListener('click', () => setPanel(false));
  $('layersList').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; layerFilter = b.dataset.l;
    document.querySelectorAll('#layersList button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    applyFilter(); select(rows.findIndex((r) => !r.grp && (!layerFilter || r.layer === layerFilter))); });
  $('iters').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b || +b.dataset.v === v) return;
    v = +b.dataset.v; layerFilter = ''; history.replaceState(null, '', `?v=${v}&s=${sc}`); renderTimeline(); rebuild(); });
  $('copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(location.href); $('copy').textContent = 'Copied'; } catch (_) { $('copy').textContent = 'Copy failed'; } setTimeout(() => ($('copy').textContent = 'Copy link'), 1400); });
  addEventListener('keydown', (e) => { if (e.key === ' ' && e.target === document.body) { e.preventDefault(); togglePlay(); } });

  document.title = window.SPEC.title.replace(/ — .*/, '') + ' Spec';
  document.documentElement.style.setProperty('--pw', `${DW}px`); document.documentElement.style.setProperty('--ph', `${DH}px`);
  if (window.SPEC.device && window.SPEC.device.label) $('deviceLabel').textContent = window.SPEC.device.label;
  if (window.SPEC.legend && window.SPEC.legend.approx) $('legendApprox').textContent = window.SPEC.legend.approx;
  // iteration tabs come from SPEC.paths (hidden when there is only one)
  $('iters').innerHTML = Object.keys(PATHS).map((k) => `<button data-v="${k}">${String(k).padStart(2, '0')}</button>`).join('');
  $('iters').hidden = Object.keys(PATHS).length < 2;
  renderTimeline(); fit(); rebuild();
})();
</script>
</body>
